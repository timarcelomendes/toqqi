<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Pesquisa</title>
    <style>
      /* Antes do JS: fundo claro e um indicador simples, sem piscar. */
      body { margin: 0; background: #f8fafc; }
      .toqqi-pre { display: flex; min-height: 60vh; align-items: center; justify-content: center; }
      .toqqi-pre i { width: 28px; height: 28px; border: 3px solid #cbd5e1; border-top-color: transparent; border-radius: 50%; animation: toqqi-g .8s linear infinite; }
      @keyframes toqqi-g { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="app"><div class="toqqi-pre" role="status" aria-label="Carregando a pesquisa"><i></i></div></div>
    <script type="module" src="/src/publico/main.ts"></script>
  </body>
</html>
