[project]
name = "toqqi-api"
version = "1.0.0"
description = "API do Toqqi (NPS/CSAT para pequenas empresas B2B) - etapas 1, 2 e 3a"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
addopts = "-p no:cacheprovider"
filterwarnings = ["ignore::DeprecationWarning"]
