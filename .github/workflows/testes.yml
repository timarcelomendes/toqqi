name: Testes
on:
  push:
  pull_request:

jobs:
  # Descobre o que mudou: alteração só no backend não roda o frontend, e vice-versa.
  mudancas:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filtro.outputs.api }}
      web: ${{ steps.filtro.outputs.web }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filtro
        with:
          filters: |
            api:
              - 'api/**'
              - '.github/workflows/testes.yml'
            web:
              - 'web/**'
              - '.github/workflows/testes.yml'

  api:
    needs: mudancas
    if: needs.mudancas.outputs.api == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: api
    env:
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Preparar papéis e bancos
        run: psql -h localhost -U postgres -f scripts/preparar_banco.sql
      - run: python -m pytest -q

  web:
    needs: mudancas
    if: needs.mudancas.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
