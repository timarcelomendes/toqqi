# Blueprint do Render: cria banco, API e site de uma vez (Dashboard > New > Blueprint > este repositório).
# Domínios (06/10/2026): o site e o app em https://toqqi.com (www.toqqi.com redireciona para lá) e a API em
# https://api.toqqi.com, cadastrados em Settings > Custom Domains de cada serviço; o DNS fica no GoDaddy
# (A @ 216.24.57.1, CNAME www toqqi-web.onrender.com, CNAME api toqqi-api.onrender.com). Os endereços
# *.onrender.com continuam respondendo. Trocou de domínio: ajuste FRONTEND_URL, ALLOWED_ORIGINS, API_PUBLIC_URL,
# VITE_API_URL e SITE_URL e publique de novo.

databases:
  - name: toqqi-db
    databaseName: toqqi
    user: toqqi
    region: oregon
    # Sem `plan`: o plano do banco é escolhido no painel do Render e o Blueprint mantém o atual. Com `plan: free` aqui, depois
    # de passar o banco para o plano pago, toda sincronização falha ("cannot downgrade database ... to Free").
    postgresMajorVersion: "16"

services:
  - type: web
    name: toqqi-api
    runtime: python
    region: oregon
    plan: free            # dorme após 15 min sem uso; o robô e os lembretes rodam no cron toqqi-tarefas, sem depender dela
    rootDir: api
    buildCommand: pip install -r requirements.txt
    # --no-proxy-headers: o X-Forwarded-For do Render traz primeiro o que o cliente mandou (trocaria o IP do limite, da
    # auditoria e dos registros de acesso); o IP real vem do CF-Connecting-IP, que a Cloudflare sobrescreve (abaixo).
    startCommand: uvicorn toqqi.main:app --host 0.0.0.0 --port $PORT --no-proxy-headers
    healthCheckPath: /api/v1/auth/regras-senha
    buildFilter:
      paths: ["api/**"]
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DATABASE_URL           # conexão do dono do banco (migrações)
        fromDatabase:
          name: toqqi-db
          property: connectionString
      - key: APP_DB_PASSWORD        # a API cria o papel restrito toqqi_app com esta senha
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL           # links dos e-mails, das pesquisas e do WhatsApp
        value: https://toqqi.com
      - key: ALLOWED_ORIGINS        # o endereço antigo do site continua liberado
        value: https://toqqi.com,https://www.toqqi.com,https://toqqi-web.onrender.com
      - key: API_PUBLIC_URL         # webhooks (WhatsApp, RD Station, Omie), descadastro em 1 clique e imagens dos e-mails
        value: https://api.toqqi.com
      - key: EMAIL_PROVIDER         # "console" até configurar o ZeptoMail; depois "zeptomail" + ZEPTOMAIL_TOKEN
        value: zeptomail
      - key: AMBIENTE
        value: producao
      - key: TAREFAS_TOKEN          # protege POST /interno/tarefas (rodar robô e lembretes à mão)
        generateValue: true
      - key: SEGREDOS_KEY           # cifra os tokens do WhatsApp guardados no banco
        generateValue: true
      - key: WHATSAPP_VERIFY_TOKEN  # código de verificação do webhook, colado no painel da Meta
        generateValue: true
      - key: WHATSAPP_APP_SECRET    # chave secreta do app da Meta (preencher quando o app existir)
        sync: false
      - key: SUPERADMIN_EMAILS
        sync: false                 # o Render pergunta na criação
      - key: GOOGLE_CLIENT_ID       # Entrar com o Google: o "ID do cliente OAuth" do Google Cloud (não é segredo);
        sync: false                 # vazio = sem o botão (docs/api-login-google.md)
      # Etapa 5g: as quatro abaixo (modelo e esforço do nível Equilibrado, cota da cortesia e exclusão automática) são
      # só o padrão: o que a equipe Toqqi salvar em Plataforma › Parâmetros vale mais.
      - key: IA_ASSISTENTE_MODELO   # assistente (etapa 5b); a OPENAI_API_KEY fica só no painel do Render
        value: gpt-6-luna
      - key: IA_ASSISTENTE_ESFORCO
        value: low
      - key: IA_COTA_CORTESIA       # análises de IA por mês das contas em cortesia (cota do plano)
        value: "200"
      - key: IP_CLIENTE_CABECALHO   # IP do cliente: o cabeçalho que a Cloudflare (na frente do Render) sobrescreve
        value: CF-Connecting-IP
      - key: EXCLUSAO_AUTOMATICA    # contas encerradas excluídas 90 dias depois (simular = só conta e registra no log)
        value: ligada
      - key: ADMIN_INICIAL_EMAIL
        sync: false
      - key: ADMIN_INICIAL_SENHA
        sync: false

  # Tarefas agendadas: hoje rodam pela rotina do GitHub (.github/workflows/tarefas.yml), que chama
  # POST /api/v1/interno/tarefas a cada 30 minutos, sem custo. O Cron Job abaixo (mais pontual, US$ 1 por mês no
  # mínimo) fica comentado para quando valer a pena (API no plano pago). Para voltar: descomente o bloco, faça o
  # Manual Sync do Blueprint, ponha OPENAI_API_KEY e ASAAS_API_KEY também no toqqi-tarefas e desligue a rotina do GitHub.
  # Tarefas agendadas: robô de envio, lembretes, envios pendentes e webhooks, a cada 15 minutos (horário UTC).
  # Conecta direto no banco (não acorda a API). Cobrança por segundo de execução, com mínimo de US$ 1 por mês.
  # As variáveis vêm da API para os dois usarem os mesmos segredos (JWT_SECRET monta os links dos lembretes).
  # Ao configurar o ZeptoMail, acrescente aqui EMAIL_FROM e ZEPTOMAIL_TOKEN (fromService), como as demais.
  # - type: cron
  #   name: toqqi-tarefas
  #   runtime: python
  #   region: oregon
  #   schedule: "*/15 * * * *"
  #   rootDir: api
  #   buildCommand: pip install -r requirements.txt
  #   startCommand: python -m toqqi.tarefas
  #   buildFilter:
  #     paths: ["api/**"]
  #   envVars:
  #     - key: PYTHON_VERSION
  #       value: "3.11.9"
  #     - key: DATABASE_URL
  #       fromDatabase:
  #         name: toqqi-db
  #         property: connectionString
  #     - key: APP_DB_PASSWORD
  #       fromService:
  #         type: web
  #         name: toqqi-api
  #         envVarKey: APP_DB_PASSWORD
  #     - key: JWT_SECRET
  #       fromService:
  #         type: web
  #         name: toqqi-api
  #         envVarKey: JWT_SECRET
  #     - key: SEGREDOS_KEY
  #       fromService:
  #         type: web
  #         name: toqqi-api
  #         envVarKey: SEGREDOS_KEY
  #     - key: FRONTEND_URL
  #       fromService:
  #         type: web
  #         name: toqqi-api
  #         envVarKey: FRONTEND_URL
  #     - key: API_PUBLIC_URL
  #       fromService:
  #         type: web
  #         name: toqqi-api
  #         envVarKey: API_PUBLIC_URL
  #     - key: EMAIL_PROVIDER
  #       fromService:
  #         type: web
  #         name: toqqi-api
  #         envVarKey: EMAIL_PROVIDER
  #     - key: AMBIENTE
  #       fromService:
  #         type: web
  #         name: toqqi-api
  #         envVarKey: AMBIENTE
  #     - key: EXCLUSAO_AUTOMATICA
  #       value: ligada

  - type: web
    name: toqqi-web
    runtime: static
    rootDir: web
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    buildFilter:
      paths: ["web/**"]
    envVars:
      - key: VITE_API_URL
        value: https://api.toqqi.com/api/v1
      - key: SITE_URL               # endereço público no <link rel="canonical">, no sitemap.xml e no robots.txt
        value: https://toqqi.com
    routes:
      - type: rewrite
        source: /r/*
        destination: /responder.html
      - type: rewrite
        source: /f/*
        destination: /responder.html
      - type: rewrite
        source: /sair/*
        destination: /responder.html
      # /sair sem token: pedir por e-mail o link de cada empresa (sair da lista ou voltar a receber)
      - type: rewrite
        source: /sair
        destination: /responder.html
      # Guias do site (web/src/site/guias.ts): cada endereço serve o seu HTML. Antes da regra geral, que manda ao app.
      - type: rewrite
        source: /guias
        destination: /guias.html
      - type: rewrite
        source: /reduzir-churn
        destination: /reduzir-churn.html
      - type: rewrite
        source: /clientes-insatisfeitos
        destination: /clientes-insatisfeitos.html
      - type: rewrite
        source: /customer-success
        destination: /customer-success.html
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      # Etapa 5l (docs/api-etapa-5l.md §3.4): as páginas de pesquisa mostram HTML escrito no editor e dividem a origem
      # com o app logado, então só rodam script do próprio site e só conversam com a API. `img-src https:` mantém os
      # logos de fora; `frame-ancestors *` mantém o widget (iframe no site do cliente). Trocou o domínio da API:
      # ajuste o connect-src também.
      - path: /r/*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' https://api.toqqi.com; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors *"
      - path: /f/*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' https://api.toqqi.com; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors *"
      - path: /sair/*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' https://api.toqqi.com; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors *"
      - path: /sair
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' https://api.toqqi.com; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors *"
