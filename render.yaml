# Blueprint do Render: cria banco, API e site de uma vez (Dashboard > New > Blueprint > este repositório).
# Se o Render der outro endereço aos serviços (nome já usado), ajuste FRONTEND_URL, ALLOWED_ORIGINS,
# API_PUBLIC_URL e VITE_API_URL e publique de novo.

databases:
  - name: toqqi-db
    databaseName: toqqi
    user: toqqi
    region: oregon
    plan: free            # o plano gratuito expira em 30 dias e só pode haver 1 por conta; depois: basic-256mb
    postgresMajorVersion: "16"

services:
  - type: web
    name: toqqi-api
    runtime: python
    region: oregon
    plan: free            # dorme após 15 min sem uso; o robô e os lembretes rodam no cron toqqi-tarefas, sem depender dela
    rootDir: api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn toqqi.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips "*"
    healthCheckPath: /api/v1/auth/regras-senha
    buildFilter:
      paths: ["api/**"]
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DATABASE_URL           # conexão do dono do banco (migrações)
        fromDatabase:
          name: toqqi-db
          property: connectionString
      - key: APP_DB_PASSWORD        # a API cria o papel restrito toqqi_app com esta senha
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://toqqi-web.onrender.com
      - key: ALLOWED_ORIGINS
        value: https://toqqi-web.onrender.com
      - key: API_PUBLIC_URL
        value: https://toqqi-api.onrender.com
      - key: EMAIL_PROVIDER         # "console" até configurar o ZeptoMail; depois "zeptomail" + ZEPTOMAIL_TOKEN
        value: zeptomail
      - key: AMBIENTE
        value: producao
      - key: TAREFAS_TOKEN          # protege POST /interno/tarefas (rodar robô e lembretes à mão)
        generateValue: true
      - key: SEGREDOS_KEY           # cifra os tokens do WhatsApp guardados no banco
        generateValue: true
      - key: WHATSAPP_VERIFY_TOKEN  # código de verificação do webhook, colado no painel da Meta
        generateValue: true
      - key: WHATSAPP_APP_SECRET    # chave secreta do app da Meta (preencher quando o app existir)
        sync: false
      - key: SUPERADMIN_EMAILS
        sync: false                 # o Render pergunta na criação
      - key: IA_ASSISTENTE_MODELO   # assistente (etapa 5b); a OPENAI_API_KEY fica só no painel do Render
        value: gpt-5-mini
      - key: IA_ASSISTENTE_ESFORCO
        value: low
      - key: IA_COTA_CORTESIA       # análises de IA por mês das contas em cortesia (cota do plano)
        value: "500"
      - key: ADMIN_INICIAL_EMAIL
        sync: false
      - key: ADMIN_INICIAL_SENHA
        sync: false

  # Tarefas agendadas: hoje rodam pela rotina do GitHub (.github/workflows/tarefas.yml), que chama
  # POST /api/v1/interno/tarefas a cada 30 minutos, sem custo. O Cron Job abaixo (mais pontual, US$ 1 por mês no
  # mínimo) fica comentado para quando valer a pena (API no plano pago). Para voltar: descomente o bloco, faça o
  # Manual Sync do Blueprint, ponha OPENAI_API_KEY e ASAAS_API_KEY também no toqqi-tarefas e desligue a rotina do GitHub.
  # Tarefas agendadas: robô de envio, lembretes, envios pendentes e webhooks, a cada 15 minutos (horário UTC).
  # Conecta direto no banco (não acorda a API). Cobrança por segundo de execução, com mínimo de US$ 1 por mês.
  # As variáveis vêm da API para os dois usarem os mesmos segredos (JWT_SECRET monta os links dos lembretes).
  # Ao configurar o ZeptoMail, acrescente aqui EMAIL_FROM e ZEPTOMAIL_TOKEN (fromService), como as demais.
  # - type: cron
  #   name: toqqi-tarefas
  #   runtime: python
  #   region: oregon
  #   schedule: "*/15 * * * *"
  #   rootDir: api
  #   buildCommand: pip install -r requirements.txt
  #   startCommand: python -m toqqi.tarefas
  #   buildFilter:
  #     paths: ["api/**"]
  #   envVars:
  #     - key: PYTHON_VERSION
  #       value: "3.11.9"
  #     - key: DATABASE_URL
  #       fromDatabase:
  #         name: toqqi-db
  #         property: connectionString
  #     - key: APP_DB_PASSWORD
  #       fromService:
  #         type: web
  #         name: toqqi-api
  #         envVarKey: APP_DB_PASSWORD
  #     - key: JWT_SECRET
  #       fromService:
  #         type: web
  #         name: toqqi-api
  #         envVarKey: JWT_SECRET
  #     - key: SEGREDOS_KEY
  #       fromService:
  #         type: web
  #         name: toqqi-api
  #         envVarKey: SEGREDOS_KEY
  #     - key: FRONTEND_URL
  #       fromService:
  #         type: web
  #         name: toqqi-api
  #         envVarKey: FRONTEND_URL
  #     - key: API_PUBLIC_URL
  #       fromService:
  #         type: web
  #         name: toqqi-api
  #         envVarKey: API_PUBLIC_URL
  #     - key: EMAIL_PROVIDER
  #       fromService:
  #         type: web
  #         name: toqqi-api
  #         envVarKey: EMAIL_PROVIDER
  #     - key: AMBIENTE
  #       fromService:
  #         type: web
  #         name: toqqi-api
  #         envVarKey: AMBIENTE

  - type: web
    name: toqqi-web
    runtime: static
    rootDir: web
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    buildFilter:
      paths: ["web/**"]
    envVars:
      - key: VITE_API_URL
        value: https://toqqi-api.onrender.com/api/v1
    routes:
      - type: rewrite
        source: /r/*
        destination: /responder.html
      - type: rewrite
        source: /f/*
        destination: /responder.html
      - type: rewrite
        source: /sair/*
        destination: /responder.html
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
